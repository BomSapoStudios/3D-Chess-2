name = "3d-chess"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# Static files: Queen Blitz daily puzzles at /daily/YYYY-MM-DD.json (made by Tools/QueenBlitz/daily.py).
# A request that matches a file is served without running the Worker, so it's free and doesn't count
# toward the daily request limit; anything else falls through to the Worker as before.
[assets]
directory = "./public"

# Room = one game; Matchmaker = the Find Match queue. SQLite-backed Durable
# Objects are the kind available on Cloudflare's free plan.
[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[durable_objects.bindings]]
name = "MATCHMAKER"
class_name = "Matchmaker"

# Accounts = every player: unique names, sign-in links, friends
[[durable_objects.bindings]]
name = "ACCOUNTS"
class_name = "Accounts"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room", "Matchmaker"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Accounts"]

[vars]
# Sign-in tokens are accepted only when issued for these apps (comma-separated).
# Apple: the iOS bundle id, plus the web Services ID once there is a web build.
APPLE_AUDIENCES = "BomSapo.Chess3D"
# Google: OAuth client ids; empty means Sign in with Google is off.
GOOGLE_CLIENT_IDS = ""
# Apple push notifications. The key itself is a secret: `npx wrangler secret put APNS_KEY`
# (paste the whole AuthKey_KTA43349Y7.p8 file).
APNS_KEY_ID = "KTA43349Y7"
APNS_TEAM_ID = "KX25Q9LD97"
APNS_TOPIC = "BomSapo.Chess3D"

# TOKEN_SECRET is a secret: set it with `npx wrangler secret put TOKEN_SECRET`.
# For local development it comes from .dev.vars (not committed).

# Sign in with Apple revocation when a player deletes their account (Apple requires it).
# SIWA_KEY is a secret: `npx wrangler secret put SIWA_KEY` (paste the whole AuthKey_P7VN9J993P.p8 of a key
# with Sign in with Apple enabled). Without it, deletion still works but the Apple link isn't cut.
SIWA_KEY_ID = "P7VN9J993P"

# Oldest app build allowed online (OnlineClient.ClientVersion in the app). Raise it only after the
# build with that number is out on TestFlight / the App Store: older builds then get "Please update"
# instead of breaking. "0" = every build, including ones from before this check.
MIN_CLIENT_VERSION = "0"
